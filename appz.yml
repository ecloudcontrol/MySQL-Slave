    app:
        name: MySQL-Slave-new
        code: mysql
        notify: appzdev@cloudbourne.co

    build:
        version: 8.1
        env: PROD
        build_file: none
        output_files: output/*.zip
        image_template: mysql_slave-8.0

    deploy:
        context: tipreprod/PROD
        type: statefulset
        replicas: 1
        ingress: none
       # resources: x-large
        port:
        - 3306

    volumes:
      - claim: mysql-data
        mount: /var/lib/mysql
        name: data
        size: 250Gi
        matchLabels: false
      - claim: mysql-backup
        mount: /appz/backup
        name: backup
        size: 250Gi
        matchLabels: false

    properties:
        MYSQL_REPLICATION_USER: replication
        MYSQL_REPLICATION_PASSWORD:
          vault: MYSQL_REPLICATION_PASSWORD
        MYSQL_ROOT_PASSWORD:
          vault: MYSQL_ROOT_PASSWORD_KEY
        DB_MASTER: mysql-8-0
        revision : 9
     
