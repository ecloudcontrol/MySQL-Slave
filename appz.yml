    app:
        name: MySQL-Slave-new
        code: mysql
        notify: appzdev@cloudbourne.co

    build:
        version: 8.3
        env: PROD
        build_file: none
        output_files: output/*.zip
        image_template: mysql_slave-8.0

    deploy:
        context: tipreprod/PROD
        type: statefulset
        replicas: 1
        #ingress: none
       # resources: x-large
        port:
        - 3306
        - 9104
    volumes:
      - claim: mysql-data
        class: linode-block-storage
        mount: /var/lib/mysql
        name: data
        size: 300Gi
        matchLabels: false
      - claim: mysql-backup
        class: linode-block-storage
        mount: /appz/backup
        name: backup
        size: 300Gi
        matchLabels: false

    properties:
        MYSQL_REPLICATION_USER: repl
        MYSQL_REPLICATION_PASSWORD:
          vault: MYSQL_REPLICATION_PASSWORD
        MYSQL_ROOT_PASSWORD:
          vault: MYSQL_ROOT_PASSWORD_KEY
        SERVER_ID: 1
        AUTO_INCREMENT_OFFSET: 2
        RUN_AS_MASTER: 'true'
        GTID_ENABLED: 'true'
        BINLOG_EXPIRE_LOGS_SECONDS: 259200
        
        revision : 9
     
